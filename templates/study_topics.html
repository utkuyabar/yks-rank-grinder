{% extends "base.html" %}
{% block title %}{{ subject }} Konuları{% endblock %}
{% block content %}
<h2 class="page-title">{{ icon }} {{ subject }}</h2>
<p class="page-sub">Konunu seç ve sayacı başlat!</p>

<a href="{{ url_for('study') }}" class="btn btn-sm btn-back">← Derslere Dön</a>

<div class="topic-list">
    {% for topic in topics %}
    <a href="{{ url_for('study_timer', subject=subject, tidx=loop.index0) }}" class="topic-card">
        <span class="topic-num">{{ loop.index }}</span>
        <span class="topic-name">{{ topic }}</span>
        <span class="topic-arrow">▶</span>
    </a>
    {% endfor %}
</div>
{% endblock %}
