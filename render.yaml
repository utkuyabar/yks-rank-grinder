services:
  - type: web
    name: yks-rank-grinder
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: yks-rank-db
          property: connectionString

databases:
  - name: yks-rank-db
    plan: free