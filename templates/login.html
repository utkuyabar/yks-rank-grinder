{% extends "base.html" %}
{% block title %}Giriş Yap — YKS Rank Grinder{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">🎮</div>
            <h1>YKS RANK GRINDER</h1>
            <p class="subtitle">Hesabına giriş yap, rütbeni yükselt!</p>
        </div>
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label>Kullanıcı Adı</label>
                <input type="text" name="username" required
                       placeholder="Summoner adını gir..." autofocus>
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-full">⚔️ Giriş Yap</button>
        </form>
        <p class="auth-footer">
            Hesabın yok mu? <a href="{{ url_for('register') }}">Kayıt Ol</a>
        </p>
    </div>
</div>
{% endblock %}
